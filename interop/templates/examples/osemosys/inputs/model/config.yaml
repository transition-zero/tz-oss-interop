REGION:
  type: set
  dtype: str
TECHNOLOGY:
  type: set
  dtype: str
FUEL:
  type: set
  dtype: str
MODE_OF_OPERATION:
  type: set
  dtype: int
YEAR:
  type: set
  dtype: int
CapitalCost:
