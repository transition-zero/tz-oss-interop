  default: 0
InputActivityRatio:
  type: param
  indices: [REGION, TECHNOLOGY, FUEL, MODE_OF_OPERATION, YEAR]
  dtype: float
  default: 0
OutputActivityRatio:
  type: param
  indices: [REGION, TECHNOLOGY, FUEL, MODE_OF_OPERATION, YEAR]
  dtype: float
  default: 0
