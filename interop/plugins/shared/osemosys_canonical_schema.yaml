  energy_capital_cost:
    columns:
      region: region
      storage: storage
      year: year
    osemosys_name: CapitalCostStorage
    osemosys_columns: [REGION, STORAGE, YEAR]
    default: 0
    unit: currency per activity
    meaning: Investment cost of one unit of new storage capacity, which holds energy.
