      year: year
    osemosys_name: CapacityFactor
    osemosys_columns: [REGION, TECHNOLOGY, TIMESLICE, YEAR]
    default: 1
    unit: fraction
    meaning: Share of the capacity of a technology that it can use in one timeslice.
    origin: OSeMOSYS v1.0.1
  availability_factor:
    columns:
      region: region
      technology: technology
      year: year
    osemosys_name: AvailabilityFactor
    osemosys_columns: [REGION, TECHNOLOGY, YEAR]
    default: 1
    unit: fraction
    meaning: Share of the year in which a technology can operate.
    origin: OSeMOSYS v1.0.1
  residual_capacity:
    columns:
      region: region
      technology: technology
      year: year
    osemosys_name: ResidualCapacity
    osemosys_columns: [REGION, TECHNOLOGY, YEAR]
    default: 0
    unit: capacity
    meaning: Capacity that exists before the model period and remains in a year.
    origin: OSeMOSYS v1.0.1
  input_activity_ratio:
    columns:
