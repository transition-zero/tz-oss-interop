# A core parameter takes its columns from the OSeMOSYS v1.0.1 model file and its default from the otoole reference config (MIT licence).
# An extension with no default applies no constraint where the model states no value.
schema_version: 1

sets:
  year:
    meaning: Years of the model period.
    osemosys_name: YEAR
  technology:
    meaning: Technologies, each of which takes in fuels, puts out fuels, or both.
    osemosys_name: TECHNOLOGY
  timeslice:
    meaning: Parts of a year, each with its own demand and availability values.
    osemosys_name: TIMESLICE
  fuel:
    meaning: Energy carriers and other commodities that technologies put out or take in.
    osemosys_name: FUEL
  pollutant:
    meaning: Emissions and other impacts that the activity of a technology causes.
    osemosys_name: EMISSION
  operating_mode:
    meaning: Modes in which a technology can operate, each with its own ratios.
    osemosys_name: MODE_OF_OPERATION
  region:
    meaning: Regions, each with its own balance of every fuel.
    osemosys_name: REGION
  season:
    meaning: Seasons that group the timeslices of a year for storage.
    osemosys_name: SEASON
  day_type:
    meaning: Day types that group the timeslices of a season for storage.
    osemosys_name: DAYTYPE
  daily_time_bracket:
    meaning: Parts of a day that group the timeslices of a day type for storage.
    osemosys_name: DAILYTIMEBRACKET
  storage:
    meaning: Storages that technologies charge and discharge.
    osemosys_name: STORAGE
  region_group:
    meaning: Groups of regions that share an emission limit or a renewable target.
    osemosys_name: REGIONGROUP

parameters:
  year_split:
    columns:
      timeslice: timeslice
      year: year
    osemosys_name: YearSplit
    osemosys_columns: [TIMESLICE, YEAR]
    default: 0
    unit: fraction
    meaning: Share of the year that one timeslice covers.
    origin: OSeMOSYS v1.0.1
  discount_rate:
    columns:
      region: region
    osemosys_name: DiscountRate
    osemosys_columns: [REGION]
    default: 0.05
    unit: rate
    meaning: Discount rate that a region applies to future costs.
    origin: OSeMOSYS v1.0.1
  technology_discount_rate:
    columns:
      region: region
      technology: technology
    osemosys_name: DiscountRateIdv
    osemosys_columns: [REGION, TECHNOLOGY]
    default_from: discount_rate
    unit: rate
    meaning: Discount rate for the investments in one technology.
    origin: OSeMOSYS v1.0.1
  lifetime:
    columns:
      region: region
      technology: technology
    osemosys_name: OperationalLife
    osemosys_columns: [REGION, TECHNOLOGY]
    default: 1
    unit: years
    meaning: Number of years that new capacity of a technology operates.
    origin: OSeMOSYS v1.0.1
  storage_discount_rate:
    columns:
      region: region
      storage: storage
    osemosys_name: DiscountRateStorage
    osemosys_columns: [REGION, STORAGE]
    default: 0.05
    unit: rate
    meaning: Discount rate for the investments in one storage.
    origin: OSeMOSYS v1.0.1
  day_split:
    columns:
      daily_time_bracket: daily_time_bracket
      year: year
    osemosys_name: DaySplit
    osemosys_columns: [DAILYTIMEBRACKET, YEAR]
    default: 0.00137
    unit: fraction
    meaning: Length of one daily time bracket, as a share of the year.
    origin: OSeMOSYS v1.0.1
  timeslice_in_season:
    columns:
      timeslice: timeslice
      season: season
    osemosys_name: Conversionls
    osemosys_columns: [TIMESLICE, SEASON]
    default: 0
    unit: flag
    meaning: 1 when a timeslice falls in a season, otherwise 0.
    origin: OSeMOSYS v1.0.1
  timeslice_in_day_type:
    columns:
      timeslice: timeslice
      day_type: day_type
    osemosys_name: Conversionld
    osemosys_columns: [TIMESLICE, DAYTYPE]
    default: 0
    unit: flag
    meaning: 1 when a timeslice falls in a day type, otherwise 0.
    origin: OSeMOSYS v1.0.1
  timeslice_in_daily_time_bracket:
    columns:
      timeslice: timeslice
      daily_time_bracket: daily_time_bracket
    osemosys_name: Conversionlh
    osemosys_columns: [TIMESLICE, DAILYTIMEBRACKET]
    default: 0
    unit: flag
    meaning: 1 when a timeslice falls in a daily time bracket, otherwise 0.
    origin: OSeMOSYS v1.0.1
  days_in_day_type:
    columns:
      season: season
      day_type: day_type
      year: year
    osemosys_name: DaysInDayType
    osemosys_columns: [SEASON, DAYTYPE, YEAR]
    default: 7
    unit: count
    meaning: Number of days of one day type in one week of a season.
    origin: OSeMOSYS v1.0.1
  transport_route:
    columns:
      start_region: region
      end_region: region
      fuel: fuel
      year: year
    osemosys_name: TradeRoute
    osemosys_columns: [REGION, _REGION, FUEL, YEAR]
    default: 0
    unit: flag
    meaning: 1 when a fuel can move from start_region to end_region, otherwise 0.
    origin: OSeMOSYS v1.0.1
  depreciation_method:
    columns:
      region: region
    osemosys_name: DepreciationMethod
    osemosys_columns: [REGION]
    default: 1
    unit: flag
    meaning: Method of the salvage value, 1 for a sinking fund and 2 for a straight line.
    origin: OSeMOSYS v1.0.1
  specified_annual_demand:
    columns:
      region: region
      fuel: fuel
      year: year
    osemosys_name: SpecifiedAnnualDemand
    osemosys_columns: [REGION, FUEL, YEAR]
    default: 0
    unit: activity
    meaning: Annual demand for a fuel that the demand profile spreads over the timeslices.
    origin: OSeMOSYS v1.0.1
  specified_demand_profile:
    columns:
      region: region
      fuel: fuel
      timeslice: timeslice
      year: year
    osemosys_name: SpecifiedDemandProfile
    osemosys_columns: [REGION, FUEL, TIMESLICE, YEAR]
    default: 0
    unit: fraction
    meaning: Share of the specified annual demand for a fuel that falls in one timeslice.
    origin: OSeMOSYS v1.0.1
  accumulated_annual_demand:
    columns:
      region: region
      fuel: fuel
      year: year
    osemosys_name: AccumulatedAnnualDemand
    osemosys_columns: [REGION, FUEL, YEAR]
    default: 0
    unit: activity
    meaning: Annual demand for a fuel that the model can meet at any time of the year.
    origin: OSeMOSYS v1.0.1
  capacity_to_activity_unit:
    columns:
      region: region
      technology: technology
    osemosys_name: CapacityToActivityUnit
    osemosys_columns: [REGION, TECHNOLOGY]
    default: 1
    unit: activity per capacity
    meaning: Activity of one unit of capacity that operates for a whole year.
    origin: OSeMOSYS v1.0.1
  capacity_factor:
    columns:
