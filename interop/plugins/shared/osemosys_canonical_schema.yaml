  capital_cost:
    columns:
      region: region
      technology: technology
      year: year
    osemosys_name: CapitalCost
    osemosys_columns: [REGION, TECHNOLOGY, YEAR]
    default: 0
    unit: currency per capacity
    meaning: Overnight investment cost of one unit of new capacity.
    origin: OSeMOSYS v1.0.1
  variable_operation_cost:
    columns:
      region: region
      technology: technology
      operating_mode: operating_mode
      year: year
    osemosys_name: VariableCost
    osemosys_columns: [REGION, TECHNOLOGY, MODE_OF_OPERATION, YEAR]
    default: 0
    unit: currency per activity
    meaning: Cost of one unit of activity of a technology in a mode.
    origin: OSeMOSYS v1.0.1
  fixed_cost:
    columns:
      region: region
      technology: technology
      year: year
