    osemosys_columns: [REGION, TECHNOLOGY, YEAR]
    default: -1
    unit: capacity
    meaning: Highest new capacity of a technology in a year, where -1 means no limit.
    origin: OSeMOSYS v1.0.1
  total_annual_min_capacity_investment:
    columns:
      region: region
