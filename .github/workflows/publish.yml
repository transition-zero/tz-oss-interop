name: Build and publish container image

on:
  push:
    tags:
      - "v*"

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write   # needed to push to GHCR
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Derive the image tag from the pushed git tag (e.g. refs/tags/v0.2.0 -> v0.2.0).
      # This needs no hatch-vcs dependency: the package does not derive its
      # version from the tag, but the tag itself is already a good version
      # string for the image.
      # Immutable version tags only — deliberately no `latest`. A consumer
      # should pin an exact version rather than float onto whatever was built
      # most recently, and a mutable tag risks serving a stale copy where a
      # pull-through cache sits in front of this registry.
      - name: Derive image tag
        id: version
        run: |
          echo "tag=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      # GHCR auth uses the workflow's own built-in GITHUB_TOKEN — no cloud
      # credentials, no service account, no long-lived secrets at all. This
      # repository holds no trust in any deployment environment. A consumer
      # that mirrors this image into its own registry authenticates with its
      # own credential, owned and rotated where that mirror is configured.
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Fail if image tag already exists
        run: |
          IMAGE="ghcr.io/${{ github.repository }}:${{ steps.version.outputs.tag }}"
          if docker manifest inspect "$IMAGE" >/dev/null 2>&1; then
            echo "Image already exists: $IMAGE"
            exit 1
          fi

      - name: Build and push image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: |
            ghcr.io/${{ github.repository }}:${{ steps.version.outputs.tag }}
          build-args: |
            GIT_SHA=${{ github.sha }}
            VERSION=${{ steps.version.outputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      # A GHCR package defaults to inheriting the repository's visibility, but
      # that is not guaranteed across every GitHub and org configuration. After
      # the first publish, check the package's visibility under Settings >
      # Packages rather than assuming it followed the repository.
