name: Mutation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  versions:
    uses: ./.github/workflows/python-versions.yml

  mutation:
    needs: versions
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # The mutation fixtures are tiny, so intra-op parallelism buys nothing across
      # thousands of short mutant runs. This does not make Polars fork-safe: a forked
      # child that touches Polars deadlocks at any pool size, which is what the
      # `fork_unsafe` re-exec in scripts/run_mutmut.py is for.
      POLARS_MAX_THREADS: "1"
      # A pull request mutates only the files it changes; a push to main mutates every file.
      MUTATION_TARGETS_FILE: ${{ github.event_name == 'pull_request' && 'mutation_targets.txt' || '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # A pull request checks out its merge commit, whose first parent is the base branch.
          fetch-depth: 2

      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Set up Python ${{ needs.versions.outputs.latest }}
        run: uv python install ${{ needs.versions.outputs.latest }}

      - name: Sync dependencies
        run: uv sync --locked --all-groups

      - name: List mutation targets
        id: targets
        if: github.event_name == 'pull_request'
        run: |
          git diff --name-only --diff-filter=d HEAD^1 HEAD \
            | uv run python scripts/mutation_scope.py > "$MUTATION_TARGETS_FILE"
          cat "$MUTATION_TARGETS_FILE"
          echo "count=$(grep -c . "$MUTATION_TARGETS_FILE" || true)" >> "$GITHUB_OUTPUT"

      # Bounded well inside the job's own limit so the score report and PR comment
      # always get to run. mutmut writes each mutant's result to disk as it finishes,
      # so a run cut short here still reports everything it got through; the report
      # names the remainder as unchecked rather than scoring them.
      - name: Run mutmut
        if: github.event_name != 'pull_request' || steps.targets.outputs.count != '0'
        timeout-minutes: 20
        continue-on-error: true
        run: make mutation || true

      - name: Build score report
        id: score
        if: always()
        env:
          MUTATION_THRESHOLD: "0.0"
        run: uv run python scripts/mutmut_score.py

      # pr-comment.yml posts this as a sticky PR comment.
      - name: Upload PR comment
        if: always() && github.event_name == 'pull_request'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pr-comment
          path: mutation_score.md
          retention-days: 1
