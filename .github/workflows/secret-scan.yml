name: Secret scan

# Repo-wide secret scanning (no path filter — secrets can appear anywhere).
# Complements GitHub-native secret scanning / push protection (a Settings toggle).
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  trufflehog:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history so TruffleHog can diff the PR / pushed range.
          fetch-depth: 0

      - name: TruffleHog OSS
        uses: trufflesecurity/trufflehog@6f3c981e7b77f235fd2702dd74af25fc4b72bf11 # v3.96.0
        with:
          # Strict policy (matches the local pre-commit hook): fail on any
          # detected secret — verified, unknown, or unverified. Suppress genuine
          # false positives with an inline `trufflehog:ignore` comment or a
          # path entry in .trufflehogignore.
          extra_args: --results=verified,unknown,unverified --exclude-paths=.trufflehogignore
