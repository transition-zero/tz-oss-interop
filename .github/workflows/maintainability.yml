name: Maintainability

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  versions:
    uses: ./.github/workflows/python-versions.yml

  maintainability:
    needs: versions
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Set up Python ${{ needs.versions.outputs.latest }}
        run: uv python install ${{ needs.versions.outputs.latest }}

      - name: Sync dependencies
        run: uv sync --locked --all-groups

      - name: Build maintainability report
        run: uv run python .github/scripts/maintainability_report.py

      # pr-comment.yml posts this as a sticky PR comment.
      - name: Upload PR comment
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pr-comment
          path: maintainability_report.md
          retention-days: 1
