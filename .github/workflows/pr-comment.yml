name: PR comment

# GitHub runs this file from main with a write token, so it must never check out or run PR code.
on:
  workflow_run:
    workflows: [Maintainability, Mutation]
    types: [completed]

permissions:
  actions: read
  pull-requests: write

jobs:
  comment:
    if: github.event.workflow_run.event == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Download PR comment
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: pr-comment
          path: pr-comment
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}

      # The PR wrote the artifact, so its number counts only if that PR's head is the commit the run tested.
      - name: Match the PR to the tested commit
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          number="$(head -n 1 pr-comment/number)"
          if [[ ! "$number" =~ ^[0-9]+$ ]]; then
            echo "::error::The artifact holds no PR number."
            exit 1
          fi
          pr_head="$(gh api "repos/$GITHUB_REPOSITORY/pulls/$number" --jq .head.sha)"
          if [[ "$pr_head" != "$HEAD_SHA" ]]; then
            echo "::notice::PR #$number moved on from $HEAD_SHA, so a later run posts its comment."
            exit 0
          fi
          echo "number=$number" >> "$GITHUB_OUTPUT"

      - name: Post sticky PR comment
        if: steps.pr.outputs.number != ''
        uses: marocchino/sticky-pull-request-comment@5770ad5eb8f42dd2c4f34da00c94c5381e49af88 # v3.0.5
        with:
          number_force: ${{ steps.pr.outputs.number }}
          header: ${{ github.event.workflow_run.name == 'Mutation' && 'mutation-score' || 'maintainability-report' }}
          path: pr-comment/body.md
