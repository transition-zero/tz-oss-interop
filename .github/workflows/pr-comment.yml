name: PR comment

# A fork PR's runs get a read-only token, so this workflow posts their comments from main.
# It runs with a write token, so it must never check out or run PR code.
on:
  workflow_run:
    workflows: [Maintainability, Mutation]
    types: [completed]

permissions:
  actions: read
  pull-requests: write

env:
  COMMENTS: >-
    {"Maintainability": {"header": "maintainability-report", "body": "maintainability_report.md"},
     "Mutation": {"header": "mutation-score", "body": "mutation_score.md"}}

jobs:
  comment:
    if: >-
      github.event.workflow_run.event == 'pull_request'
      && github.event.workflow_run.conclusion != 'cancelled'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Find the PR the run tested
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_LABEL: ${{ github.event.workflow_run.head_repository.owner.login }}:${{ github.event.workflow_run.head_branch }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          number="$(gh api -X GET "repos/$GITHUB_REPOSITORY/pulls" -f head="$HEAD_LABEL" -f base=main -f state=open \
            --jq ".[] | select(.head.sha == \"$HEAD_SHA\") | .number")"
          if [[ -z "$number" ]]; then
            echo "::notice::No open PR has the head $HEAD_SHA now, so this run posts no comment."
            exit 0
          fi
          echo "number=$number" >> "$GITHUB_OUTPUT"

      - name: Download PR comment
        if: steps.pr.outputs.number != ''
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: pr-comment
          path: pr-comment
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}

      - name: Post sticky PR comment
        if: steps.pr.outputs.number != ''
        uses: marocchino/sticky-pull-request-comment@5770ad5eb8f42dd2c4f34da00c94c5381e49af88 # v3.0.5
        with:
          number_force: ${{ steps.pr.outputs.number }}
          header: ${{ fromJSON(env.COMMENTS)[github.event.workflow_run.name].header }}
          path: pr-comment/${{ fromJSON(env.COMMENTS)[github.event.workflow_run.name].body }}
