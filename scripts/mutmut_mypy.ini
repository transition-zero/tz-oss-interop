# Relaxed mypy config used only by mutmut's type_check_command (see [tool.mutmut]
# in pyproject.toml) to discard type-invalid mutants before they are test-run.
# Deliberately non-strict: it must report mutation-induced type errors
# (arg-type/call-arg) while staying silent on strict-only diagnostics such as
# unused-ignore, which appear all over the mutated trampoline tree and cannot be
# mapped back to a mutant. Real type checking of the project stays strict via
# [tool.mypy].
[mypy]
python_version = 3.11
warn_unused_ignores = False
follow_imports = silent
ignore_missing_imports = True
