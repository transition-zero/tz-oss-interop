[project]
name = "interop-testing"
version = "0.1.0"
requires-python = ">=3.11,<3.14"
description = "Test harness for projects that build interop pipelines."
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "TransitionZero", email = "info@transitionzero.org" }]
classifiers = [
    "Development Status :: 4 - Beta",
    "Framework :: Pytest",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering",
]
# Never a runtime dependency of anything: a consumer puts it in its dev group.
# It depends on interop (builders drive the pipeline through the headless CLI);
# nothing in interop may depend on it.
dependencies = [
    "interop",
    "pypsa>=1.2.4",
    "pandas>=3.0.5",
    "pytest>=9.1.1",
    "pytest-bdd>=7.3",
    "pyyaml>=6",
]

[project.urls]
Homepage = "https://github.com/transition-zero/tz-oss-interop"
Repository = "https://github.com/transition-zero/tz-oss-interop"
Issues = "https://github.com/transition-zero/tz-oss-interop/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/interop_testing"]

[tool.uv.sources]
interop = { workspace = true }
