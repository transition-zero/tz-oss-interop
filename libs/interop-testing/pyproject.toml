[project]
name = "tz-oss-interop-testing"
dynamic = ["version", "dependencies"]
requires-python = ">=3.11,<3.14"
description = "Test harness for projects that build tz-oss-interop pipelines."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "TransitionZero", email = "info@transitionzero.org" }]
classifiers = [
    "Development Status :: 4 - Beta",
    "Framework :: Pytest",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering",
]

[project.urls]
Homepage = "https://github.com/transition-zero/tz-oss-interop"
Repository = "https://github.com/transition-zero/tz-oss-interop"
Issues = "https://github.com/transition-zero/tz-oss-interop/issues"

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

# The repository root holds the tags, and this package sits two levels under it.
[tool.hatch.version]
source = "vcs"
raw-options = { root = "../.." }

# Never a runtime dependency of anything: a consumer puts it in its dev group.
# It depends on tz-oss-interop (builders drive the pipeline through the headless
# CLI); nothing in tz-oss-interop may depend on it.
#
# `hatch_build.py` puts the tz-oss-interop requirement in front of this list, at
# the exact version of the build. A harness that runs against another release of
# the library tests code that it was not built against.
[tool.hatch.metadata.hooks.custom]
path = "hatch_build.py"
dependencies = [
    # The strict SiennaSchemas bundle check needs the extra, which pulls jsonschema.
    "power-openapi-models[source-version]",
    "pypsa>=1.3.0",
    "pandas>=3.0.6",
    "pytest>=9.1.1",
    "pytest-bdd>=9.0.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/interop_testing"]

# hatch-vcs takes the version from the git state and from
# SETUPTOOLS_SCM_PRETEND_VERSION, and uv tracks neither by default, so `uv sync`
# reuses a wheel that carries the version of the previous build. The git key covers
# a tag added to a commit that is already built, which is what a release does. The
# environment key covers the Dockerfile, which sets the variable and keeps a
# persistent uv cache mount. Setting `cache-keys` replaces the defaults, so
# `pyproject.toml` stays in the list.
[tool.uv]
cache-keys = [
    { file = "pyproject.toml" },
    { git = { commit = true, tags = true } },
    { env = "SETUPTOOLS_SCM_PRETEND_VERSION" },
]

[tool.uv.sources]
tz-oss-interop = { workspace = true }
